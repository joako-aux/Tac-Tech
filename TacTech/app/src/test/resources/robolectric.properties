# Configuracion de Robolectric para todas las pruebas unitarias
# SDK 34: funciona con JDK 17 (el SDK 35 exige JDK 21)
sdk=34
# Por defecto se usa una Application vacia: asi las pruebas no arrancan la sincronizacion real.
# Las pruebas de MainActivity y de las factories usan @Config(application = ServicioTecnicoApp::class)
application=android.app.Application
# Pantalla alta: las listas (LazyColumn) componen todos sus elementos
qualifiers=w411dp-h2000dp
